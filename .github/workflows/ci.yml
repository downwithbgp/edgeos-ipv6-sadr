name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint and unit checks
        run: make test

  netns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run privileged network-namespace proof of concept
        run: make test-netns
